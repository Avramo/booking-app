<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Class Potash — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A96E;
    --gold-light: #E8D5B0;
    --dark: #0E0D0B;
    --dark-2: #1A1814;
    --dark-3: #252320;
    --text: #F5F0E8;
    --text-muted: #8A8070;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .bg-lines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 80px, var(--gold) 80px, var(--gold) 81px),
      repeating-linear-gradient(90deg, transparent, transparent 80px, var(--gold) 80px, var(--gold) 81px);
  }

  .bg-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 640px;
  }

  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 0.2s forwards;
  }

  .ornament-line {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold));
  }

  .ornament-line.right {
    background: linear-gradient(to left, transparent, var(--gold));
  }

  .ornament-diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2.8rem, 7vw, 4rem);
    letter-spacing: 0.12em;
    color: var(--text);
    line-height: 1.1;
    opacity: 0;
    animation: fadeUp 1s ease 0.4s forwards;
  }

  .brand span {
    color: var(--gold);
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin: 1.8rem auto;
    opacity: 0;
    animation: fadeUp 1s ease 0.6s forwards;
  }

  .tagline {
    font-size: 0.9rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0;
    animation: fadeUp 1s ease 0.7s forwards;
  }

  .message {
    margin-top: 3rem;
    font-size: 1.15rem;
    line-height: 1.8;
    color: var(--text-muted);
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 1s ease 0.9s forwards;
  }

  .message strong {
    color: var(--gold-light);
    font-weight: 400;
  }

  .contact {
    margin-top: 2.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 1.1s forwards;
  }

  .contact a {
    color: var(--gold);
    text-decoration: none;
    font-size: 0.82rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(201,169,110,0.3);
    padding-bottom: 2px;
    transition: border-color 0.3s;
  }

  .contact a:hover {
    border-color: var(--gold);
  }

  .bottom-ornament {
    margin-top: 3.5rem;
    opacity: 0;
    animation: fadeUp 1s ease 1.2s forwards;
  }

  .dots {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--dark-3);
  }

  .dot.active {
    background: var(--gold);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="bg-lines"></div>
<div class="bg-glow"></div>

<div class="container">

  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-diamond"></div>
    <div class="ornament-line right"></div>
  </div>

  <h1 class="brand">First Class <span>Potash</span></h1>

  <div class="divider"></div>

  <p class="tagline">Luxury Travel &amp; Concierge</p>

  <p class="message">
    Something exceptional is on its way.<br>
    We are putting the finishing touches on a <strong>bespoke travel experience</strong><br>
    crafted for the discerning traveler.
  </p>


  <div class="bottom-ornament">
    <div class="dots">
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot active"></div>
    </div>
  </div>

</div>

</body>
</html>
